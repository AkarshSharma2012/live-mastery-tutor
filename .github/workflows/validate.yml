name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run state-engine tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate JSON assets
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('skills/live-mastery-tutor/assets').rglob('*.json')]"
      - name: Verify Agent Skills discovery
        run: npx --yes skills add . --list
